[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotelagent"
version = "1.0.0"
description = "HotelAgent — KI-Hotelassistent"
requires-python = ">=3.10"

[project.scripts]
agent = "cli:app"

[tool.setuptools]
py-modules = ["cli", "gui", "main"]
packages = ["scripts", "agents", "config"]
